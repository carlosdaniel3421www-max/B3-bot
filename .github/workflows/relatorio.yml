name: Relatorio Diario B3

# Roda automaticamente em dias úteis às 13:15 UTC (10:15 no horário de Brasília)
# e também permite rodar manualmente pelo botão "Run workflow" no GitHub.
on:
  schedule:
    - cron: "15 13 * * 1-5"
  workflow_dispatch:

jobs:
  rodar-relatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install yfinance pandas numpy matplotlib feedparser requests

      - name: Rodar relatório diário
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPLAB_TOKEN: ${{ secrets.OPLAB_TOKEN }}
        run: python relatorio_diario.py
