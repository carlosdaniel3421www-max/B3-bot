name: Bot Telegram (comandos)

# DESATIVADO: os comandos agora são processados pelo servidor Render (webhook,
# resposta instantânea). Este workflow era o polling antigo a cada 5 min, que
# conflitava com o Render e causava respostas duplicadas/estado divergente.
# Manter como fallback manual apenas.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  processar-comandos:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Processar comandos do Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python telegram_bot.py

      - name: Salvar mudanças (posicoes.json, propostas.json, offset)
        run: |
          git config user.name "robo-b3-bot"
          git config user.email "actions@github.com"
          git add posicoes.json propostas.json telegram_offset.json
          git diff --staged --quiet || git commit -m "Atualiza posicoes/propostas [skip ci]"
          git pull --rebase --autostash origin main
          git push