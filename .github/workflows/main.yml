name: B3 Swing Analyzer Daily

on:
  schedule:
    # Roda todo dia útil às 09:00 (Horário de Brasília aprox - UTC-3)
    - cron: '0 12 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente na aba Actions

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies (TA-Lib)
        run: |
          sudo apt-get update
          sudo apt-get install -y libta-lib-dev libta-lib0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python relatorio_diario.py
