name: B3 Robot Daily

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          # O NOME AQUI DEVE SER IGUAL AO DO SEU SECRET E AO QUE O PYTHON ESPERA
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python relatorio_diario.py

      - name: Save estado and proposals
        run: |
          git config user.name "robo-b3-bot"
          git config user.email "actions@github.com"
          git add estado.json propostas.json
          git diff --staged --quiet || git commit -m "Atualiza estado.json e propostas [skip ci]"
          git pull --rebase --autostash origin main
          git push
